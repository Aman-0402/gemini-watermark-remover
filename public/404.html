<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gemini Watermark Remover</title>
  <!--
    GitHub Pages SPA redirect trick (https://github.com/rafgraph/spa-github-pages).
    GitHub Pages has no server-side routing, so a direct hit on /video, /faq, etc.
    404s. This encodes the real path into a query string and redirects to the app's
    index.html, which decodes it back via the matching script in index.html.
  -->
  <script>
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
